services:

  productapi:

    build: .

    ports:
      - "5000:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development

    depends_on:
      - sqlserver

  sqlserver:

    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: sqlserver1

    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrongPassword123"

    ports:
      - "1433:1433"

    volumes:
      - sql_data:/var/opt/mssql

volumes:
  sql_data: